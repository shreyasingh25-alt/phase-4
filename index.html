<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gemini Quiz Helper</title>

  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="container">

    <h1>🧠 Gemini Quiz Helper</h1>

    <input
      type="text"
      id="topicInput"
      placeholder="Enter topic..."
    />

    <button id="generateBtn">
      Generate Quiz
    </button>

    <div class="quiz-box">

      <h2>Question:</h2>

      <p id="question">
        Your question will appear here...
      </p>

      <h2>Answer:</h2>

      <p id="answer">
        Your answer will appear here...
      </p>

    </div>

  </div>

  <script src="index.js"></script>

</body>
</html>
