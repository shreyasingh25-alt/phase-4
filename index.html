<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI content genrator</title>

    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>🚀 AI Content Generator</h1>

        <div class="output" id="answeroutput"></div>

    </div>

    <div class="card">
        <h1>Quick Summarizer</h1>

        <textarea id="summaryInput" placeholder="Paste your text here...."></textarea>
        <button id="summaryBtn">Summarize</button>
        <div class="output" id="summaryOutput"></div>


    </div>

    <div>

        <div class="card"></div>

        <h1>Idea Generator</h1>

        <input type="text" id="ideaInput" placeholder="Enter topic">

        <button id="ideaBtn">Generate Ideas</button>

        <div class="output" id="ideaOutput"></div>




    </div>

    <div class="card">
        <h1>Definition Finder</h1>

        <input type="text" id="defineInput" placeholder="Enter any term">

        <button id="defineBtn">Find Definition</button>

        <p id="defineOutput"></p>

        <div class="output" id="definition"></div>




    </div>

    <script src="script.js"></script>
    
</body>
</html>
